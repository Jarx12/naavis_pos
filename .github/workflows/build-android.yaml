name: Build Unsigned APK

on:
  workflow_dispatch: 

jobs:
  build-apk:
    name: 🎉 Compilar APK
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar App (APK release, split per ABI)
        run: flutter build apk --release --split-per-abi --dart-define=BASE_URL=${{ secrets.BASE_URL }}

      - name: Subir archivos APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-app-apk-split
          path: build/app/outputs/flutter-apk/*.apk